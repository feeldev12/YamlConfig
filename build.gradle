plugins {
    id 'java-library'
    id 'maven-publish'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

// Java 17 bytecode so Java 17 runtimes (e.g. Minecraft 1.20.1 mods/servers) can load it too.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

base {
    archivesName = "yamlconfig"
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnlyApi "org.slf4j:slf4j-api:2.0.7"
    api "org.yaml:snakeyaml:1.8"
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
